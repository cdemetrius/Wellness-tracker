    // ── WEIGHT TRACKER ────────────────────────────────────────

    function WeightTracker({ weightData, onUpdate }) {
      const [weightInput, setWeightInput] = useState("");
      const [goalInput, setGoalInput] = useState(weightData.goalWeight ? String(weightData.goalWeight) : "");
      const [lossRate, setLossRate] = useState(weightData.lossPerWeek ?? 1.0);
      const [avgPeriod, setAvgPeriod] = useState("30");
      const [editingGoal, setEditingGoal] = useState(false);

      const entries = [...(weightData.entries || [])].sort((a, b) => a.date < b.date ? 1 : -1);
      const todayEntry = entries.find((e) => e.date === todayKey());
      const yesterdayEntry = entries.find((e) => e.date === prevDay(todayKey()));

      const logWeight = () => {
        const val = parseFloat(weightInput);
        if (isNaN(val) || val < 50 || val > 500) return;
        const updated = { ...weightData };
        const existing = updated.entries.findIndex((e) => e.date === todayKey());
        if (existing >= 0) updated.entries[existing].weight = val;
        else updated.entries.push({ date: todayKey(), weight: val });
        onUpdate(updated);
        setWeightInput("");
      };

      const setGoal = () => {
        const val = parseFloat(goalInput);
        if (isNaN(val)) return;
        onUpdate({ ...weightData, goalWeight: val });
        setEditingGoal(false);
      };

      const setLoss = (val) => {
        setLossRate(val);
        onUpdate({ ...weightData, lossPerWeek: val });
      };

      // Filtered entries for average period
      const periodEntries = (() => {
        const now = new Date();
        const cutoffs = { "7": 7, "30": 30, "90": 90, "365": 365, "all": 99999 };
        const days = cutoffs[avgPeriod] ?? 30;
        const cutoff = toKey(new Date(now - days * 86400000));
        return entries.filter((e) => e.date >= cutoff);
      })();

      const periodAvg = periodEntries.length > 0
        ? (periodEntries.reduce((s, e) => s + e.weight, 0) / periodEntries.length).toFixed(1)
        : null;

      // Weight change color
      const weightColor = () => {
        if (!todayEntry || !yesterdayEntry) return C.text;
        if (todayEntry.weight < yesterdayEntry.weight) return C.sage;
        if (todayEntry.weight === yesterdayEntry.weight) return C.amber;
        return C.coral;
      };

      // Projected date to goal
      const projectedDate = (() => {
        if (!weightData.goalWeight || !todayEntry || lossRate <= 0) return null;
        const diff = todayEntry.weight - weightData.goalWeight;
        if (diff <= 0) return "Goal reached! 🎉";
        const weeks = diff / lossRate;
        const proj = new Date(Date.now() + weeks * 7 * 86400000);
        return proj.toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });
      })();

      // Sparkline data for chart (last 30 entries max)
      const chartEntries = [...entries].reverse().slice(-30);
      const chartMin = chartEntries.length > 0 ? Math.min(...chartEntries.map(e => e.weight)) - 2 : 0;
      const chartMax = chartEntries.length > 0 ? Math.max(...chartEntries.map(e => e.weight)) + 2 : 100;
      const chartW = 480, chartH = 120;
      const cx = (i) => (i / Math.max(chartEntries.length - 1, 1)) * chartW;
      const cy = (w) => chartH - ((w - chartMin) / (chartMax - chartMin)) * chartH;
      const pathD = chartEntries.map((e, i) => `${i === 0 ? "M" : "L"} ${cx(i)} ${cy(e.weight)}`).join(" ");
      const goalY = weightData.goalWeight ? cy(weightData.goalWeight) : null;

      const SL = ({ text }) => (
        <p style={{ color: C.soft, fontSize: 11, textTransform: "uppercase", letterSpacing: "0.08em", margin: "0 0 10px" }}>{text}</p>
      );

      return (
        <div>
          <h2 style={{ color: C.text, fontSize: 20, fontWeight: 700, margin: "0 0 20px" }}>Weight</h2>

          {/* Log today's weight */}
          <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 14, padding: 16, marginBottom: 16 }}>
            <SL text="Log today's weight (lbs)" />
            <div style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 12 }}>
              <input type="number" value={weightInput} onChange={(e) => setWeightInput(e.target.value)}
                onKeyDown={(e) => { if (e.key === "Enter") logWeight(); }}
                placeholder={todayEntry ? String(todayEntry.weight) : "e.g. 145.5"}
                style={{ flex: 1, padding: "12px 14px", background: C.bg, border: `1.5px solid ${C.border}`, borderRadius: 10, color: C.text, fontSize: 16, outline: "none" }}
                onFocus={(e) => (e.target.style.borderColor = C.sage)}
                onBlur={(e) => (e.target.style.borderColor = C.border)}
              />
              <button onClick={logWeight} style={{ padding: "12px 20px", background: C.sage, border: "none", borderRadius: 10, color: "#fff", fontSize: 14, fontWeight: 700, cursor: "pointer" }}>
                {todayEntry ? "Update" : "Log"}
              </button>
            </div>
            {todayEntry && (
              <div style={{ display: "flex", alignItems: "baseline", gap: 10 }}>
                <span style={{ color: weightColor(), fontSize: 36, fontWeight: 800 }}>{todayEntry.weight}</span>
                <span style={{ color: C.muted, fontSize: 14 }}>lbs</span>
                {yesterdayEntry && (
                  <span style={{ color: weightColor(), fontSize: 14, fontWeight: 600 }}>
                    {todayEntry.weight < yesterdayEntry.weight ? "▼" : todayEntry.weight > yesterdayEntry.weight ? "▲" : "="} {Math.abs(todayEntry.weight - yesterdayEntry.weight).toFixed(1)} vs yesterday
                  </span>
                )}
              </div>
            )}
          </div>

          {/* Goal & projection */}
          <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 14, padding: 16, marginBottom: 16 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 12 }}>
              <SL text="Goal weight" />
              <button onClick={() => setEditingGoal(!editingGoal)} style={{ background: "transparent", border: `1px solid ${C.border}`, borderRadius: 6, padding: "3px 8px", color: C.soft, fontSize: 11, cursor: "pointer" }}>
                {editingGoal ? "Cancel" : "✏️ Edit"}
              </button>
            </div>
            {editingGoal ? (
              <div style={{ display: "flex", gap: 8 }}>
                <input type="number" value={goalInput} onChange={(e) => setGoalInput(e.target.value)}
                  placeholder="Goal weight in lbs"
                  style={{ flex: 1, padding: "10px 14px", background: C.bg, border: `1.5px solid ${C.sage}`, borderRadius: 10, color: C.text, fontSize: 14, outline: "none" }}
                />
                <button onClick={setGoal} style={{ padding: "10px 16px", background: C.sage, border: "none", borderRadius: 10, color: "#fff", fontSize: 14, fontWeight: 700, cursor: "pointer" }}>Set</button>
              </div>
            ) : (
              <div>
                {weightData.goalWeight ? (
                  <>
                    <div style={{ display: "flex", gap: 16, marginBottom: 10 }}>
                      <div>
                        <p style={{ color: C.muted, fontSize: 11, margin: "0 0 2px" }}>Goal</p>
                        <p style={{ color: C.sage, fontSize: 22, fontWeight: 800, margin: 0 }}>{weightData.goalWeight} lbs</p>
                      </div>
                      {todayEntry && (
                        <div>
                          <p style={{ color: C.muted, fontSize: 11, margin: "0 0 2px" }}>To go</p>
                          <p style={{ color: todayEntry.weight > weightData.goalWeight ? C.coral : C.sage, fontSize: 22, fontWeight: 800, margin: 0 }}>
                            {Math.abs(todayEntry.weight - weightData.goalWeight).toFixed(1)} lbs
                          </p>
                        </div>
                      )}
                    </div>
                    <div style={{ marginBottom: 10 }}>
                      <p style={{ color: C.soft, fontSize: 11, textTransform: "uppercase", letterSpacing: "0.08em", margin: "0 0 8px" }}>Weekly loss target</p>
                      <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                        <button onClick={() => setLoss(Math.max(0.5, parseFloat((lossRate - 0.5).toFixed(1))))}
                          style={{ width: 36, height: 36, borderRadius: "50%", background: C.bg, border: `1px solid ${C.border}`, color: C.text, fontSize: 18, cursor: lossRate <= 0.5 ? "default" : "pointer", opacity: lossRate <= 0.5 ? 0.3 : 1 }}>−</button>
                        <span style={{ color: C.text, fontSize: 18, fontWeight: 700, flex: 1, textAlign: "center" }}>{lossRate} lbs/week</span>
                        <button onClick={() => setLoss(Math.min(2.5, parseFloat((lossRate + 0.5).toFixed(1))))}
                          style={{ width: 36, height: 36, borderRadius: "50%", background: C.bg, border: `1px solid ${C.border}`, color: C.text, fontSize: 18, cursor: lossRate >= 2.5 ? "default" : "pointer", opacity: lossRate >= 2.5 ? 0.3 : 1 }}>+</button>
                      </div>
                    </div>
                    {projectedDate && (
                      <div style={{ padding: "10px 14px", background: C.bg, borderRadius: 10, border: `1px solid ${C.border}` }}>
                        <p style={{ color: C.soft, fontSize: 11, margin: "0 0 2px" }}>At {lossRate} lbs/week, projected goal date:</p>
                        <p style={{ color: C.sage, fontSize: 14, fontWeight: 700, margin: 0 }}>{projectedDate}</p>
                      </div>
                    )}
                  </>
                ) : (
                  <p style={{ color: C.muted, fontSize: 13 }}>No goal set yet — tap Edit to add one.</p>
                )}
              </div>
            )}
          </div>

          {/* Average weight toggle */}
          <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 14, padding: 16, marginBottom: 16 }}>
            <SL text="Average weight" />
            <div style={{ display: "flex", gap: 6, marginBottom: 14 }}>
              {[["7", "7 days"], ["30", "30 days"], ["90", "3 months"], ["365", "1 year"], ["all", "All time"]].map(([val, label]) => (
                <button key={val} onClick={() => setAvgPeriod(val)} style={{
                  flex: 1, padding: "6px 2px", background: avgPeriod === val ? C.sageDim : C.bg,
                  border: `1.5px solid ${avgPeriod === val ? C.sage : C.border}`,
                  borderRadius: 8, color: avgPeriod === val ? C.sage : C.soft,
                  fontSize: 10, fontWeight: avgPeriod === val ? 700 : 400, cursor: "pointer",
                }}>{label}</button>
              ))}
            </div>
            {periodAvg ? (
              <div style={{ display: "flex", alignItems: "baseline", gap: 8 }}>
                <span style={{ color: C.text, fontSize: 32, fontWeight: 800 }}>{periodAvg}</span>
                <span style={{ color: C.muted, fontSize: 14 }}>lbs avg · {periodEntries.length} entries</span>
              </div>
            ) : (
              <p style={{ color: C.muted, fontSize: 13 }}>No data for this period.</p>
            )}
          </div>

          {/* Trend chart */}
          {chartEntries.length > 1 && (
            <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 14, padding: 16, marginBottom: 16 }}>
              <SL text="Weight trend" />
              <div style={{ overflowX: "auto" }}>
                <svg viewBox={`0 0 ${chartW} ${chartH + 30}`} style={{ width: "100%", minWidth: 200 }}>
                  {/* Goal line */}
                  {goalY !== null && goalY >= 0 && goalY <= chartH && (
                    <line x1={0} y1={goalY} x2={chartW} y2={goalY} stroke={C.sage} strokeWidth={1} strokeDasharray="6,4" opacity={0.6} />
                  )}
                  {/* Trend line */}
                  <path d={pathD} fill="none" stroke={C.blue} strokeWidth={2.5} strokeLinejoin="round" strokeLinecap="round" />
                  {/* Dots */}
                  {chartEntries.map((e, i) => (
                    <circle key={i} cx={cx(i)} cy={cy(e.weight)} r={3} fill={C.blue} />
                  ))}
                  {/* Min/max labels */}
                  <text x={4} y={12} fill={C.soft} fontSize={10}>{chartMax.toFixed(0)}</text>
                  <text x={4} y={chartH - 4} fill={C.soft} fontSize={10}>{chartMin.toFixed(0)}</text>
                  {/* First and last date */}
                  {chartEntries.length > 0 && (
                    <>
                      <text x={4} y={chartH + 20} fill={C.muted} fontSize={9}>{new Date(chartEntries[0].date + "T12:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric" })}</text>
                      <text x={chartW - 4} y={chartH + 20} textAnchor="end" fill={C.muted} fontSize={9}>{new Date(chartEntries[chartEntries.length - 1].date + "T12:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric" })}</text>
                    </>
                  )}
                  {/* Goal label */}
                  {goalY !== null && weightData.goalWeight && (
                    <text x={chartW - 4} y={goalY - 4} textAnchor="end" fill={C.sage} fontSize={9}>goal: {weightData.goalWeight}</text>
                  )}
                </svg>
              </div>
              <p style={{ color: C.muted, fontSize: 11, margin: "4px 0 0" }}>Dashed line = goal weight · Blue line = actual weight</p>
            </div>
          )}

          {/* Recent entries */}
          {entries.length > 0 && (
            <div>
              <SL text="Recent entries" />
              {entries.slice(0, 10).map((e, i) => {
                const prev = entries[i + 1];
                const diff = prev ? e.weight - prev.weight : null;
                const color = diff === null ? C.soft : diff < 0 ? C.sage : diff > 0 ? C.coral : C.amber;
                return (
                  <div key={e.date} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 14px", background: C.surface, border: `1px solid ${C.border}`, borderRadius: 10, marginBottom: 6 }}>
                    <span style={{ color: C.soft, fontSize: 12 }}>{new Date(e.date + "T12:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric" })}</span>
                    <span style={{ color: C.text, fontSize: 15, fontWeight: 700 }}>{e.weight} lbs</span>
                    {diff !== null && (
                      <span style={{ color, fontSize: 12, fontWeight: 600 }}>
                        {diff < 0 ? "▼" : diff > 0 ? "▲" : "="} {Math.abs(diff).toFixed(1)}
                      </span>
                    )}
                  </div>
                );
              })}
            </div>
          )}
        </div>
      );
    }

    // ── DATA PORTAL ───────────────────────────────────────────

    function DataPortal({ log, weeklyGoal, weightData, onImport, onClose }) {
      const [mode, setMode] = useState("menu");
      const [importText, setImportText] = useState("");
      const [importError, setImportError] = useState("");
      const [copied, setCopied] = useState(false);
      const [clearDate, setClearDate] = useState(todayKey());
      const [clearConfirm, setClearConfirm] = useState(false);
      const [clearDone, setClearDone] = useState(false);

      const exportData = JSON.stringify({ log, weeklyGoal, weightData, exportedAt: new Date().toISOString() }, null, 2);

      const handleCopy = async () => {
        try {
          await navigator.clipboard.writeText(exportData);
          setCopied(true);
          setTimeout(() => setCopied(false), 2000);
        } catch {
          document.getElementById("export-ta")?.select();
        }
      };

      const handleImport = () => {
        setImportError("");
        try {
          const parsed = JSON.parse(importText.trim());
          if (!parsed.log || typeof parsed.log !== "object") throw new Error("Invalid format — missing log data.");
          onImport(parsed.log, parsed.weeklyGoal ?? 7, parsed.weightData ?? null);
          onClose();
        } catch (e) {
          setImportError(e.message || "Invalid JSON. Make sure you pasted the full export.");
        }
      };

      return (
        <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.7)", zIndex: 200, display: "flex", alignItems: "flex-end", justifyContent: "center" }}
          onClick={(e) => e.target === e.currentTarget && onClose()}>
          <div style={{ background: C.surface, borderRadius: "20px 20px 0 0", width: "100%", maxWidth: 520, padding: "24px 20px 40px", border: `1px solid ${C.border}`, maxHeight: "85vh", overflowY: "auto" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20 }}>
              <h3 style={{ color: C.text, fontSize: 17, fontWeight: 700, margin: 0 }}>
                {mode === "menu" ? "Data" : mode === "export" ? "Export data" : mode === "import" ? "Import data" : "Clear old data"}
              </h3>
              <button onClick={onClose} style={{ background: "transparent", border: "none", color: C.muted, fontSize: 22, cursor: "pointer" }}>×</button>
            </div>

            {mode === "menu" && (
              <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                <button onClick={() => setMode("export")} style={{ padding: "14px 16px", background: C.bg, border: `1px solid ${C.border}`, borderRadius: 12, cursor: "pointer", textAlign: "left", display: "flex", alignItems: "center", gap: 12 }}>
                  <span style={{ fontSize: 22 }}>📤</span>
                  <div>
                    <p style={{ color: C.text, fontSize: 14, fontWeight: 600, margin: "0 0 2px" }}>Export</p>
                    <p style={{ color: C.soft, fontSize: 12, margin: 0 }}>Copy your data to save in Notes or email</p>
                  </div>
                </button>
                <button onClick={() => setMode("import")} style={{ padding: "14px 16px", background: C.bg, border: `1px solid ${C.border}`, borderRadius: 12, cursor: "pointer", textAlign: "left", display: "flex", alignItems: "center", gap: 12 }}>
                  <span style={{ fontSize: 22 }}>📥</span>
                  <div>
                    <p style={{ color: C.text, fontSize: 14, fontWeight: 600, margin: "0 0 2px" }}>Import</p>
                    <p style={{ color: C.soft, fontSize: 12, margin: 0 }}>Paste previously exported data to restore</p>
                  </div>
                </button>
                <button onClick={() => { setMode("clear"); setClearConfirm(false); setClearDone(false); }} style={{ padding: "14px 16px", background: C.bg, border: `1px solid ${C.coral}44`, borderRadius: 12, cursor: "pointer", textAlign: "left", display: "flex", alignItems: "center", gap: 12 }}>
                  <span style={{ fontSize: 22 }}>🗑️</span>
                  <div>
                    <p style={{ color: C.coral, fontSize: 14, fontWeight: 600, margin: "0 0 2px" }}>Clear data before a date</p>
                    <p style={{ color: C.soft, fontSize: 12, margin: 0 }}>Remove entries older than a date you choose</p>
                  </div>
                </button>
              </div>
            )}

            {mode === "export" && (
              <div>
                <p style={{ color: C.soft, fontSize: 13, margin: "0 0 12px", lineHeight: 1.5 }}>Copy the text below and paste it into your Notes app. Use Import to restore it later.</p>
                <textarea id="export-ta" readOnly value={exportData} rows={8}
                  style={{ width: "100%", padding: "12px", background: C.bg, border: `1px solid ${C.border}`, borderRadius: 10, color: C.soft, fontSize: 11, fontFamily: "monospace", resize: "none", boxSizing: "border-box" }}
                  onFocus={(e) => e.target.select()} />
                <button onClick={handleCopy} style={{ width: "100%", marginTop: 12, padding: "14px", background: copied ? C.sageDim : C.sage, border: `1px solid ${copied ? C.sage : "transparent"}`, borderRadius: 12, color: "#fff", fontSize: 15, fontWeight: 700, cursor: "pointer" }}>
                  {copied ? "✓ Copied!" : "Copy to clipboard"}
                </button>
                <button onClick={() => setMode("menu")} style={{ width: "100%", marginTop: 8, padding: "12px", background: "transparent", border: "none", color: C.soft, fontSize: 13, cursor: "pointer" }}>← Back</button>
              </div>
            )}

            {mode === "import" && (
              <div>
                <p style={{ color: C.soft, fontSize: 13, margin: "0 0 12px", lineHeight: 1.5 }}>Paste your previously exported data below. This will replace your current data.</p>
                <textarea value={importText} onChange={(e) => setImportText(e.target.value)} placeholder="Paste your exported JSON here…" rows={8}
                  style={{ width: "100%", padding: "12px", background: C.bg, border: `1.5px solid ${importError ? C.coral : C.border}`, borderRadius: 10, color: C.text, fontSize: 11, fontFamily: "monospace", resize: "none", boxSizing: "border-box", outline: "none" }} />
                {importError && <p style={{ color: C.coral, fontSize: 12, margin: "6px 0 0" }}>{importError}</p>}
                <button onClick={handleImport} disabled={!importText.trim()} style={{ width: "100%", marginTop: 12, padding: "14px", background: importText.trim() ? C.sage : C.muted, border: "none", borderRadius: 12, color: importText.trim() ? "#fff" : C.soft, fontSize: 15, fontWeight: 700, cursor: importText.trim() ? "pointer" : "default" }}>
                  Restore data
                </button>
                <button onClick={() => setMode("menu")} style={{ width: "100%", marginTop: 8, padding: "12px", background: "transparent", border: "none", color: C.soft, fontSize: 13, cursor: "pointer" }}>← Back</button>
              </div>
            )}

            {mode === "clear" && (
              <div>
                {clearDone ? (
                  <div style={{ textAlign: "center", padding: "20px 0" }}>
                    <p style={{ fontSize: 40, margin: "0 0 12px" }}>✓</p>
                    <p style={{ color: C.sage, fontSize: 16, fontWeight: 700, margin: "0 0 6px" }}>Done!</p>
                    <p style={{ color: C.soft, fontSize: 13, margin: "0 0 20px" }}>Entries before {new Date(clearDate + "T12:00:00").toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" })} have been removed.</p>
                    <button onClick={onClose} style={{ width: "100%", padding: "14px", background: C.sage, border: "none", borderRadius: 12, color: "#fff", fontSize: 15, fontWeight: 700, cursor: "pointer" }}>Close</button>
                  </div>
                ) : (
                  <>
                    <p style={{ color: C.soft, fontSize: 13, margin: "0 0 16px", lineHeight: 1.5 }}>
                      Choose a date. All check-in entries <strong>before</strong> this date will be permanently deleted. Entries on or after this date are kept.
                    </p>
                    <p style={{ color: C.soft, fontSize: 11, textTransform: "uppercase", letterSpacing: "0.08em", margin: "0 0 8px" }}>Delete entries before</p>
                    <input
                      type="date"
                      value={clearDate}
                      onChange={(e) => { setClearDate(e.target.value); setClearConfirm(false); }}
                      max={todayKey()}
                      style={{
                        width: "100%", padding: "12px 14px", background: C.bg,
                        border: `1.5px solid ${C.border}`, borderRadius: 10,
                        color: C.text, fontSize: 15, outline: "none",
                        boxSizing: "border-box", marginBottom: 12,
                        colorScheme: "dark",
                      }}
                    />
                    {(() => {
                      const count = Object.keys(log).filter(d => d < clearDate).length;
                      return count > 0
                        ? <p style={{ color: C.amber, fontSize: 13, margin: "0 0 16px" }}>⚠️ This will delete <strong>{count} entr{count === 1 ? "y" : "ies"}</strong> before {new Date(clearDate + "T12:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" })}.</p>
                        : <p style={{ color: C.soft, fontSize: 13, margin: "0 0 16px" }}>No entries found before this date.</p>;
                    })()}
                    {!clearConfirm ? (
                      <button
                        onClick={() => {
                          const count = Object.keys(log).filter(d => d < clearDate).length;
                          if (count > 0) setClearConfirm(true);
                        }}
                        disabled={Object.keys(log).filter(d => d < clearDate).length === 0}
                        style={{
                          width: "100%", padding: "14px",
                          background: Object.keys(log).filter(d => d < clearDate).length > 0 ? C.coral : C.muted,
                          border: "none", borderRadius: 12, color: "#fff",
                          fontSize: 15, fontWeight: 700,
                          cursor: Object.keys(log).filter(d => d < clearDate).length > 0 ? "pointer" : "default",
                        }}
                      >
                        Delete entries before this date
                      </button>
                    ) : (
                      <div style={{ padding: "16px", background: C.coralDim, border: `1px solid ${C.coral}44`, borderRadius: 12, marginBottom: 8 }}>
                        <p style={{ color: C.coral, fontSize: 14, fontWeight: 600, margin: "0 0 12px" }}>Are you sure? This cannot be undone.</p>
                        <div style={{ display: "flex", gap: 8 }}>
                          <button onClick={() => setClearConfirm(false)} style={{ flex: 1, padding: "12px", background: C.bg, border: `1px solid ${C.border}`, borderRadius: 10, color: C.soft, fontSize: 14, cursor: "pointer" }}>Cancel</button>
                          <button onClick={() => {
                            const cleaned = Object.fromEntries(Object.entries(log).filter(([d]) => d >= clearDate));
                            onImport(cleaned, weeklyGoal, weightData);
                            setClearConfirm(false);
                            setClearDone(true);
                          }} style={{ flex: 1, padding: "12px", background: C.coral, border: "none", borderRadius: 10, color: "#fff", fontSize: 14, fontWeight: 700, cursor: "pointer" }}>Yes, delete</button>
                        </div>
                      </div>
                    )}
                    <button onClick={() => setMode("menu")} style={{ width: "100%", marginTop: 8, padding: "12px", background: "transparent", border: "none", color: C.soft, fontSize: 13, cursor: "pointer" }}>← Back</button>
                  </>
                )}
              </div>
            )}
          </div>
        </div>
      );
    }

    // ── ROOT ──────────────────────────────────────────────────

    function App() {
      const [tab, setTab] = useState("checkin");
      const [log, setLog] = useState(() => loadAll());
      const [weeklyGoal, setWeeklyGoal] = useState(() => loadSettings().weeklyGoal ?? 7);
      const [activeDate, setActiveDate] = useState(todayKey());
      const [showPortal, setShowPortal] = useState(false);
      const [saveFlash, setSaveFlash] = useState(false);
      const [weightData, setWeightData] = useState(() => loadWeightData());
      const [darkMode, setDarkMode] = useState(false);

      // Update global C before every render
      C = darkMode ? DARK : LIGHT;

      const handleWeightUpdate = (data) => {
        setWeightData(data);
        saveWeightData(data);
      };

      const handleChangeGoal = (n) => {
        setWeeklyGoal(n);
        saveSettings({ weeklyGoal: n });
      };

      const handleSave = (date, form) => {
        const updated = { ...log, [date]: { ...form, savedAt: new Date().toISOString() } };
        setLog(updated);
        saveAll(updated);
        setSaveFlash(true);
        setTimeout(() => setSaveFlash(false), 1500);
      };

      const handleImport = (importedLog, importedGoal, importedWeight) => {
        setLog(importedLog);
        setWeeklyGoal(importedGoal);
        saveAll(importedLog);
        saveSettings({ weeklyGoal: importedGoal });
        if (importedWeight) { setWeightData(importedWeight); saveWeightData(importedWeight); }
      };

      const todayHasEntry = !!log[todayKey()];

      // Sync body background with theme
      useEffect(() => {
        document.body.style.background = C.bg;
        document.body.style.color = C.text;
      }, [darkMode]);

      return (
        <div style={{ background: C.bg, minHeight: "100vh", transition: "background 0.2s" }}>
          <div style={{ padding: "20px 20px 0", borderBottom: `1px solid ${C.border}`, position: "sticky", top: 0, background: C.bg, zIndex: 10 }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <span style={{ fontSize: 22 }}>🌿</span>
                <span style={{ color: C.text, fontSize: 17, fontWeight: 700 }}>Wellness Log</span>
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                {todayHasEntry && (
                  <span style={{ background: C.sageDim, color: C.sage, fontSize: 11, fontWeight: 600, padding: "3px 10px", borderRadius: 20, border: `1px solid ${C.sage}44` }}>
                    Today logged ✓
                  </span>
                )}
                <button onClick={() => setDarkMode(d => !d)} style={{ background: C.bg, border: `1px solid ${C.border}`, borderRadius: 8, padding: "5px 10px", cursor: "pointer", color: C.soft, fontSize: 18, lineHeight: 1 }} title="Toggle light/dark mode">{darkMode ? "☀️" : "🌙"}</button>
                <button onClick={() => setShowPortal(true)} style={{ background: C.bg, border: `1px solid ${C.border}`, borderRadius: 8, padding: "5px 10px", cursor: "pointer", color: C.soft, fontSize: 18, lineHeight: 1 }} title="Export / Import data">💾</button>
              </div>
            </div>
            <div style={{ display: "flex" }}>
              {[["checkin", "Check-in"], ["trends", "Trends"], ["weight", "Weight"]].map(([t, label]) => (
                <button key={t} onClick={() => setTab(t)} style={{
                  flex: 1, padding: "10px", background: "transparent", border: "none",
                  borderBottom: `2px solid ${tab === t ? C.sage : "transparent"}`,
                  color: tab === t ? C.sage : C.soft,
                  fontSize: 13, fontWeight: tab === t ? 700 : 400, cursor: "pointer",
                }}>
                  {label}
                </button>
              ))}
            </div>
          </div>

          {saveFlash && (
            <div style={{ background: C.sageDim, borderBottom: `1px solid ${C.sage}44`, padding: "8px 20px", display: "flex", alignItems: "center", gap: 8 }}>
              <span style={{ fontSize: 14 }}>✓</span>
              <p style={{ color: C.sage, fontSize: 12, margin: 0 }}>Saved to your device.</p>
            </div>
          )}

          {showPortal && <DataPortal log={log} weeklyGoal={weeklyGoal} weightData={weightData} onImport={handleImport} onClose={() => setShowPortal(false)} />}

          <div style={{ padding: "24px 20px 60px", maxWidth: 520, margin: "0 auto" }}>
            {tab === "checkin"
              ? <CheckIn log={log} onSave={handleSave} weeklyGoal={weeklyGoal} onChangeGoal={handleChangeGoal} activeDate={activeDate} onChangeDate={setActiveDate} />
              : tab === "trends"
              ? <Trends data={log} weeklyGoal={weeklyGoal} />
              : <WeightTracker weightData={weightData} onUpdate={handleWeightUpdate} />}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
