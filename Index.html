<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Wellness Log">
  <meta name="theme-color" content="#111418">
  <title>Wellness Log</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #111418; color: #e8eaf0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
    #root { height: 100%; }
    textarea { -webkit-appearance: none; appearance: none; }
    button { -webkit-appearance: none; appearance: none; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #111418; }
    ::-webkit-scrollbar-thumb { background: #272d37; border-radius: 2px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const C = {
      bg: "#111418", surface: "#1a1f26", border: "#272d37", muted: "#4a5568",
      text: "#e8eaf0", soft: "#9aa3b2", sage: "#6b9e7e", sageDim: "#2a3d32",
      amber: "#d4956a", amberDim: "#3a2a1a", coral: "#e07a6b", coralDim: "#3a1a1a",
      blue: "#6b9ec4", blueDim: "#1a2d3a",
    };

    const MOODS = [
      { value: 1, emoji: "😞", label: "Low" },
      { value: 2, emoji: "😕", label: "Meh" },
      { value: 3, emoji: "😐", label: "Okay" },
      { value: 4, emoji: "🙂", label: "Good" },
      { value: 5, emoji: "😄", label: "Great" },
    ];

    const ENERGY = [
      { value: 1, emoji: "🪫", label: "Drained" },
      { value: 2, emoji: "😴", label: "Tired" },
      { value: 3, emoji: "😑", label: "Neutral" },
      { value: 4, emoji: "⚡", label: "Energised" },
      { value: 5, emoji: "🔥", label: "Fired up" },
    ];

    const DRINK_BUCKETS = [
      { value: 0, label: "Zero drinks", color: C.sage },
      { value: 1, label: "1–2 drinks", color: C.amber },
      { value: 2, label: "3+ drinks", color: C.coral },
    ];

    const BUCKET_COUNT = { 0: 0, 1: 1.5, 2: 3 };
    const STORAGE_KEY = "wellness_log_v2";
    const SETTINGS_KEY = "wellness_settings_v1";

    const toKey = (date) => date.toISOString().slice(0, 10);
    const todayKey = () => toKey(new Date());

    function weekStart(dateStr) {
      const d = new Date(dateStr + "T12:00:00");
      const day = d.getDay();
      const diff = day === 0 ? -6 : 1 - day;
      const mon = new Date(d);
      mon.setDate(d.getDate() + diff);
      return toKey(mon);
    }

    function weekDatesFor(dateStr) {
      const start = weekStart(dateStr);
      const dates = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(start + "T12:00:00");
        d.setDate(d.getDate() + i);
        dates.push(toKey(d));
      }
      return dates;
    }

    function formatDateLabel(dateStr) {
      const today = todayKey();
      const yesterday = toKey(new Date(Date.now() - 86400000));
      if (dateStr === today) return "Today";
      if (dateStr === yesterday) return "Yesterday";
      return new Date(dateStr + "T12:00:00").toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
    }

    function prevDay(dateStr) {
      const d = new Date(dateStr + "T12:00:00");
      d.setDate(d.getDate() - 1);
      return toKey(d);
    }

    function drinksByNight(log) {
      const map = {};
      Object.entries(log).forEach(([checkInDate, entry]) => {
        if (entry.drinks !== null && entry.drinks !== undefined) {
          const nightDate = prevDay(checkInDate);
          map[nightDate] = (map[nightDate] ?? 0) + (BUCKET_COUNT[entry.drinks] ?? 0);
        }
      });
      return map;
    }

    function lastNDays(n) {
      const days = [];
      for (let i = 0; i < n; i++) {
        const d = new Date(Date.now() - i * 86400000);
        days.push(toKey(d));
      }
      return days;
    }

    function loadAll() {
      try { const v = localStorage.getItem(STORAGE_KEY); return v ? JSON.parse(v) : {}; }
      catch { return {}; }
    }
    function saveAll(data) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); return true; }
      catch { return false; }
    }
    function loadSettings() {
      try { const v = localStorage.getItem(SETTINGS_KEY); return v ? JSON.parse(v) : { weeklyGoal: 7 }; }
      catch { return { weeklyGoal: 7 }; }
    }
    function saveSettings(s) {
      try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); } catch {}
    }

    function avg(arr) {
      if (!arr.length) return null;
      return arr.reduce((a, b) => a + b, 0) / arr.length;
    }
    function moodEmoji(val, arr) {
      return arr.find((m) => m.value === val)?.emoji ?? "—";
    }

    // ── UI PRIMITIVES ─────────────────────────────────────────

    function MoodPicker({ options, value, onChange }) {
      return (
        <div style={{ display: "flex", gap: 8 }}>
          {options.map((o) => (
            <button key={o.value} onClick={() => onChange(value === o.value ? null : o.value)} style={{
              flex: 1, padding: "10px 4px",
              background: value === o.value ? C.sageDim : C.surface,
              border: `1.5px solid ${value === o.value ? C.sage : C.border}`,
              borderRadius: 10, cursor: "pointer",
              display: "flex", flexDirection: "column", alignItems: "center", gap: 4,
              transition: "all 0.15s",
            }}>
              <span style={{ fontSize: 22 }}>{o.emoji}</span>
              <span style={{ fontSize: 10, color: value === o.value ? C.sage : C.soft }}>{o.label}</span>
            </button>
          ))}
        </div>
      );
    }

    function YesNo({ value, onChange }) {
      return (
        <div style={{ display: "flex", gap: 8 }}>
          {["Yes", "No"].map((opt) => {
            const active = value === opt;
            const isYes = opt === "Yes";
            return (
              <button key={opt} onClick={() => onChange(active ? null : opt)} style={{
                flex: 1, padding: "10px",
                background: active ? (isYes ? C.sageDim : C.amberDim) : C.surface,
                border: `1.5px solid ${active ? (isYes ? C.sage : C.amber) : C.border}`,
                borderRadius: 10, color: active ? (isYes ? C.sage : C.amber) : C.soft,
                fontWeight: 600, fontSize: 14, cursor: "pointer", transition: "all 0.15s",
              }}>{opt}</button>
            );
          })}
        </div>
      );
    }

    function DrinkPicker({ value, onChange }) {
      return (
        <div style={{ display: "flex", gap: 8 }}>
          {DRINK_BUCKETS.map((b) => {
            const active = value === b.value;
            return (
              <button key={b.value} onClick={() => onChange(active ? null : b.value)} style={{
                flex: 1, padding: "10px 6px",
                background: active ? b.color + "22" : C.surface,
                border: `1.5px solid ${active ? b.color : C.border}`,
                borderRadius: 10, color: active ? b.color : C.soft,
                fontSize: 12, fontWeight: 600, cursor: "pointer",
                transition: "all 0.15s", lineHeight: 1.3,
              }}>{b.label}</button>
            );
          })}
        </div>
      );
    }

    function Section({ title, children }) {
      return (
        <div style={{ marginBottom: 20 }}>
          <p style={{ color: C.soft, fontSize: 11, textTransform: "uppercase", letterSpacing: "0.1em", margin: "0 0 10px" }}>{title}</p>
          {children}
        </div>
      );
    }

    function Bar({ value, max = 5, color = C.sage }) {
      return (
        <div style={{ background: C.border, borderRadius: 4, height: 6, flex: 1, overflow: "hidden" }}>
          <div style={{ width: `${Math.min((value / max) * 100, 100)}%`, height: "100%", background: color, borderRadius: 4, transition: "width 0.4s ease" }} />
        </div>
      );
    }

    // ── WEEKLY COUNTER ────────────────────────────────────────

    function WeeklyCounter({ log, weeklyGoal, onChangeGoal, activeDate, onChangeDate }) {
      const [editing, setEditing] = useState(false);
      const [draft, setDraft] = useState(String(weeklyGoal));

      const weekDates = weekDatesFor(activeDate);
      const nightMap = drinksByNight(log);
      const estimated = weekDates.reduce((sum, d) => sum + (nightMap[d] ?? 0), 0);
      const daysLeft = weekDates.filter((d) => d > todayKey()).length;
      const remaining = Math.max(0, weeklyGoal - estimated);
      const overGoal = estimated > weeklyGoal;
      const barColor = overGoal ? C.coral : estimated / weeklyGoal > 0.75 ? C.amber : C.sage;
      const dayLabels = ["M", "T", "W", "T", "F", "S", "S"];

      const commitGoal = () => {
        const n = parseInt(draft, 10);
        if (!isNaN(n) && n >= 0 && n <= 30) onChangeGoal(n);
        setEditing(false);
      };

      return (
        <div style={{ background: C.surface, border: `1px solid ${overGoal ? C.coral + "66" : C.border}`, borderRadius: 14, padding: 16, marginBottom: 20 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 14 }}>
            <div>
              <p style={{ color: C.soft, fontSize: 11, textTransform: "uppercase", letterSpacing: "0.08em", margin: "0 0 4px" }}>
                {weekDatesFor(activeDate)[0] === weekDatesFor(todayKey())[0] ? "This week's drinks" : `Week of ${new Date(weekDates[0] + "T12:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric" })}`}
              </p>
              <div style={{ display: "flex", alignItems: "baseline", gap: 6 }}>
                <span style={{ color: overGoal ? C.coral : C.text, fontSize: 28, fontWeight: 800 }}>
                  ~{estimated % 1 === 0 ? estimated : estimated.toFixed(1)}
                </span>
                <span style={{ color: C.muted, fontSize: 14 }}>/ {weeklyGoal} goal</span>
              </div>
            </div>
            <div>
              {editing ? (
                <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                  <input type="number" min="0" max="30" value={draft}
                    onChange={(e) => setDraft(e.target.value)}
                    onKeyDown={(e) => { if (e.key === "Enter") commitGoal(); if (e.key === "Escape") setEditing(false); }}
                    autoFocus
                    style={{ width: 52, padding: "6px 8px", background: C.bg, border: `1.5px solid ${C.sage}`, borderRadius: 8, color: C.text, fontSize: 14, textAlign: "center" }}
                  />
                  <button onClick={commitGoal} style={{ padding: "6px 10px", background: C.sage, border: "none", borderRadius: 8, color: "#fff", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>Set</button>
                </div>
              ) : (
                <button onClick={() => { setDraft(String(weeklyGoal)); setEditing(true); }} style={{ padding: "5px 10px", background: C.bg, border: `1px solid ${C.border}`, borderRadius: 8, color: C.soft, fontSize: 11, cursor: "pointer", display: "flex", alignItems: "center", gap: 5 }}>
                  ✏️ Change goal
                </button>
              )}
            </div>
          </div>
          <div style={{ marginBottom: 12 }}>
            <div style={{ background: C.border, borderRadius: 6, height: 8, overflow: "hidden" }}>
              <div style={{ width: `${Math.min((estimated / weeklyGoal) * 100, 100)}%`, height: "100%", background: barColor, borderRadius: 6, transition: "width 0.5s ease" }} />
            </div>
          </div>
          <div style={{ display: "flex", gap: 6, marginBottom: 12 }}>
            {weekDates.map((d, i) => {
              const isActive = d === activeDate;
              const isToday = d === todayKey();
              const isFuture = d > todayKey();
              const nightDrinks = nightMap[d];
              const hasNightData = nightDrinks !== undefined;
              const dot = hasNightData
                ? (nightDrinks === 0 ? C.sage : nightDrinks <= 1.5 ? C.amber : C.coral)
                : (isToday ? C.blue : C.border);
              return (
                <button key={d} onClick={() => !isFuture && onChangeDate(d)}
                  style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 4, background: "transparent", border: "none", padding: "2px 0", cursor: isFuture ? "default" : "pointer", opacity: isFuture ? 0.35 : 1 }}>
                  <div style={{ width: "100%", paddingBottom: "100%", borderRadius: "50%", background: dot, outline: isActive ? `2px solid ${C.text}` : "none", outlineOffset: 2 }} />
                  <span style={{ color: isActive ? C.text : C.muted, fontSize: 10, fontWeight: isActive ? 700 : 400 }}>{dayLabels[i]}</span>
                </button>
              );
            })}
          </div>
          <p style={{ color: overGoal ? C.coral : C.soft, fontSize: 12, margin: 0 }}>
            {overGoal
              ? `Over goal by ~${(estimated - weeklyGoal).toFixed(1)} drink${(estimated - weeklyGoal) !== 1 ? "s" : ""}. ${daysLeft > 0 ? `${daysLeft} days left.` : ""}`
              : remaining === 0 ? "Right at your goal. Hold the line."
              : `~${remaining % 1 === 0 ? remaining : remaining.toFixed(1)} remaining · ${daysLeft} day${daysLeft !== 1 ? "s" : ""} left`}
          </p>
        </div>
      );
    }

    // ── DATE SELECTOR ─────────────────────────────────────────

    function DateSelector({ activeDate, log, onChange }) {
      const [open, setOpen] = useState(false);
      const days = lastNDays(14);

      return (
        <div style={{ marginBottom: 20, position: "relative" }}>
          <button onClick={() => setOpen((v) => !v)} style={{
            width: "100%", padding: "11px 14px",
            background: activeDate !== todayKey() ? C.blueDim : C.surface,
            border: `1.5px solid ${activeDate !== todayKey() ? C.blue : C.border}`,
            borderRadius: 10, cursor: "pointer",
            display: "flex", justifyContent: "space-between", alignItems: "center",
          }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <span style={{ fontSize: 16 }}>📅</span>
              <span style={{ color: activeDate !== todayKey() ? C.blue : C.text, fontSize: 14, fontWeight: 600 }}>
                {formatDateLabel(activeDate)}
              </span>
              {log[activeDate] && (
                <span style={{ background: C.sageDim, color: C.sage, fontSize: 10, fontWeight: 600, padding: "2px 8px", borderRadius: 20, border: `1px solid ${C.sage}44` }}>logged</span>
              )}
            </div>
            <span style={{ color: C.muted, fontSize: 12 }}>{open ? "▲" : "▼"}</span>
          </button>
          {open && (
            <div style={{ position: "absolute", top: "calc(100% + 6px)", left: 0, right: 0, background: C.surface, border: `1px solid ${C.border}`, borderRadius: 12, zIndex: 100, overflow: "hidden", boxShadow: "0 8px 32px rgba(0,0,0,0.4)" }}>
              {days.map((d) => {
                const hasEntry = !!log[d];
                const isActive = d === activeDate;
                return (
                  <button key={d} onClick={() => { onChange(d); setOpen(false); }} style={{
                    width: "100%", padding: "11px 16px", background: isActive ? C.sageDim : "transparent",
                    border: "none", borderBottom: `1px solid ${C.border}`,
                    cursor: "pointer", display: "flex", justifyContent: "space-between", alignItems: "center",
                  }}>
                    <span style={{ color: isActive ? C.sage : C.text, fontSize: 13, fontWeight: isActive ? 700 : 400 }}>
                      {formatDateLabel(d)}
                    </span>
                    <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
                      {hasEntry ? (
                        <>
                          <span style={{ fontSize: 14 }}>{log[d].drinks === 0 ? "💧" : log[d].drinks === 1 ? "🍷" : "🍾"}</span>
                          <span style={{ fontSize: 14 }}>{moodEmoji(log[d].wakeupMood, MOODS)}</span>
                          {log[d].gym === "Yes" && <span style={{ fontSize: 13 }}>🏋️</span>}
                        </>
                      ) : <span style={{ color: C.muted, fontSize: 11 }}>no entry</span>}
                    </div>
                  </button>
                );
              })}
            </div>
          )}
        </div>
      );
    }

    // ── CHECK-IN ──────────────────────────────────────────────

    function CheckIn({ log, onSave, weeklyGoal, onChangeGoal, activeDate, onChangeDate }) {
      const existing = log[activeDate];
      const blankForm = { drinks: null, wakeupMood: null, wakeupEnergy: null, gym: null, gymMood: null, otherActivity: null, otherMood: null, note: "" };
      const [form, setForm] = useState(existing ?? blankForm);
      const [lastSaved, setLastSaved] = useState(existing ? "existing" : null);

      useEffect(() => {
        setForm(log[activeDate] ?? blankForm);
        setLastSaved(log[activeDate] ? "existing" : null);
      }, [activeDate]);

      const set = (k, v) => setForm((f) => ({ ...f, [k]: v }));
      const hasAnyData = Object.entries(form).some(([k, v]) => k !== "note" && v !== null) || (form.note && form.note.trim());

      const handleSave = () => {
        if (!hasAnyData) return;
        onSave(activeDate, form);
        setLastSaved(new Date().toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }));
      };

      return (
        <div>
          <div style={{ marginBottom: 20 }}>
            <h2 style={{ color: C.text, fontSize: 20, fontWeight: 700, margin: "0 0 4px" }}>
              {activeDate === todayKey() ? "Morning check-in" : "Edit entry"}
            </h2>
            <p style={{ color: C.soft, fontSize: 13, margin: 0 }}>
              {new Date(activeDate + "T12:00:00").toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" })}
            </p>
          </div>

          <DateSelector activeDate={activeDate} log={log} onChange={onChangeDate} />
          <WeeklyCounter log={log} weeklyGoal={weeklyGoal} onChangeGoal={onChangeGoal} activeDate={activeDate} onChangeDate={onChangeDate} />

          <Section title="Drinks last night">
            <DrinkPicker value={form.drinks} onChange={(v) => set("drinks", v)} />
          </Section>
          <Section title="Waking mood">
            <MoodPicker options={MOODS} value={form.wakeupMood} onChange={(v) => set("wakeupMood", v)} />
          </Section>
          <Section title="Waking energy">
            <MoodPicker options={ENERGY} value={form.wakeupEnergy} onChange={(v) => set("wakeupEnergy", v)} />
          </Section>
          <Section title="Did you go to the gym?">
            <YesNo value={form.gym} onChange={(v) => { set("gym", v); if (v === "No" || v === null) set("gymMood", null); }} />
          </Section>
          {form.gym === "Yes" && (
            <Section title="Post-gym mood">
              <MoodPicker options={MOODS} value={form.gymMood} onChange={(v) => set("gymMood", v)} />
            </Section>
          )}
          <Section title="Other activity today?">
            <YesNo value={form.otherActivity} onChange={(v) => { set("otherActivity", v); if (v === "No" || v === null) set("otherMood", null); }} />
          </Section>
          {form.otherActivity === "Yes" && (
            <Section title="Post-activity mood">
              <MoodPicker options={MOODS} value={form.otherMood} onChange={(v) => set("otherMood", v)} />
            </Section>
          )}
          <Section title="Notes (optional)">
            <textarea
              value={form.note ?? ""}
              onChange={(e) => set("note", e.target.value)}
              placeholder="Anything worth remembering about today…"
              rows={3}
              style={{
                width: "100%", padding: "12px 14px", background: C.surface,
                border: `1.5px solid ${C.border}`, borderRadius: 10,
                color: C.text, fontSize: 14, resize: "vertical", outline: "none",
                boxSizing: "border-box", lineHeight: 1.5,
              }}
              onFocus={(e) => (e.target.style.borderColor = C.sage)}
              onBlur={(e) => (e.target.style.borderColor = C.border)}
            />
          </Section>

          <button onClick={handleSave} disabled={!hasAnyData} style={{
            width: "100%", padding: "14px",
            background: hasAnyData ? C.sage : C.muted,
            border: "none", borderRadius: 12,
            color: hasAnyData ? "#fff" : C.soft,
            fontSize: 15, fontWeight: 700,
            cursor: hasAnyData ? "pointer" : "default",
            transition: "background 0.2s",
          }}>
            {existing ? "Update entry" : "Save entry"}
          </button>

          {lastSaved && lastSaved !== "existing" && (
            <p style={{ color: C.sage, fontSize: 12, textAlign: "center", margin: "10px 0 0" }}>
              ✓ Saved at {lastSaved} — you can keep editing
            </p>
          )}
        </div>
      );
    }

    // ── TRENDS ────────────────────────────────────────────────

    function Trends({ data, weeklyGoal }) {
      const [expandedNote, setExpandedNote] = useState(null);

      const entries = Object.entries(data)
        .sort(([a], [b]) => (a < b ? 1 : -1))
        .slice(0, 60)
        .map(([date, d]) => ({ date, ...d }));

      if (entries.length < 2) {
        return (
          <div style={{ textAlign: "center", padding: "40px 0", color: C.soft }}>
            <p style={{ fontSize: 32, margin: "0 0 12px" }}>📊</p>
            <p>Log at least 2 days to see trends.</p>
          </div>
        );
      }

      const last7 = entries.slice(0, 7);
      const drinkCounts = [0, 0, 0];
      entries.forEach((e) => { if (e.drinks !== null) drinkCounts[e.drinks]++; });
      const totalDrinkEntries = drinkCounts.reduce((a, b) => a + b, 0);
      const gymYes = entries.filter((e) => e.gym === "Yes").length;
      const gymRate = Math.round((gymYes / entries.length) * 100);

      const avgMoodByDrink = DRINK_BUCKETS.map((b) => {
        const sub = entries.filter((e) => e.drinks === b.value && e.wakeupMood);
        return { ...b, avg: avg(sub.map((e) => e.wakeupMood)), n: sub.length };
      });
      const avgEnergyByDrink = DRINK_BUCKETS.map((b) => {
        const sub = entries.filter((e) => e.drinks === b.value && e.wakeupEnergy);
        return { ...b, avg: avg(sub.map((e) => e.wakeupEnergy)), n: sub.length };
      });

      const gymDays = entries.filter((e) => e.gym === "Yes" && e.gymMood && e.wakeupMood);
      const avgGymLift = avg(gymDays.map((e) => e.gymMood - e.wakeupMood));
      const noGymDays = entries.filter((e) => e.gym === "No" && e.wakeupMood);
      const avgGymMood = avg(gymDays.map((e) => e.gymMood));
      const avgNoGymMood = avg(noGymDays.map((e) => e.wakeupMood));

      const gymStreak = (() => { let s = 0; for (const e of entries) { if (e.gym === "Yes") s++; else break; } return s; })();
      const zeroDrinkStreak = (() => { let s = 0; for (const e of entries) { if (e.drinks === 0) s++; else break; } return s; })();

      const weekMap = {};
      entries.forEach((e) => {
        if (e.drinks === null || e.drinks === undefined) return;
        const nightDate = prevDay(e.date);
        const ws = weekStart(nightDate);
        if (!weekMap[ws]) weekMap[ws] = 0;
        weekMap[ws] += BUCKET_COUNT[e.drinks] ?? 0;
      });
      const weekTotals = Object.entries(weekMap).sort(([a], [b]) => (a < b ? 1 : -1)).slice(0, 8);
      const currentWeekStart = weekStart(todayKey());

      const StatCard = ({ label, value, sub, color = C.sage }) => (
        <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 12, padding: "14px 16px", flex: 1, minWidth: 0 }}>
          <p style={{ color: C.soft, fontSize: 10, textTransform: "uppercase", letterSpacing: "0.08em", margin: "0 0 6px" }}>{label}</p>
          <p style={{ color, fontSize: 24, fontWeight: 800, margin: "0 0 2px" }}>{value}</p>
          {sub && <p style={{ color: C.muted, fontSize: 11, margin: 0 }}>{sub}</p>}
        </div>
      );

      const InsightRow = ({ icon, text }) => (
        <div style={{ display: "flex", gap: 10, padding: "12px 14px", background: C.surface, border: `1px solid ${C.border}`, borderRadius: 10, marginBottom: 8, alignItems: "flex-start" }}>
          <span style={{ fontSize: 18, lineHeight: 1.4 }}>{icon}</span>
          <p style={{ color: C.text, fontSize: 13, margin: 0, lineHeight: 1.5 }}>{text}</p>
        </div>
      );

      const SL = ({ text }) => (
        <p style={{ color: C.soft, fontSize: 11, textTransform: "uppercase", letterSpacing: "0.08em", margin: "0 0 10px" }}>{text}</p>
      );

      const insights = [];
      if (avgMoodByDrink[0].n > 0 && avgMoodByDrink[2].n > 0) {
        const diff = (avgMoodByDrink[0].avg - avgMoodByDrink[2].avg).toFixed(1);
        if (diff > 0) insights.push({ icon: "🌅", text: `On zero-drink nights, your morning mood averages ${diff} points higher than after 3+ drinks.` });
      }
      if (avgEnergyByDrink[0].n > 0 && avgEnergyByDrink[2].n > 0) {
        const diff = (avgEnergyByDrink[0].avg - avgEnergyByDrink[2].avg).toFixed(1);
        if (diff > 0) insights.push({ icon: "⚡", text: `Zero-drink nights give you +${diff} points of morning energy vs nights with 3+ drinks.` });
      }
      if (avgGymLift !== null) {
        const s = avgGymLift >= 0 ? `+${avgGymLift.toFixed(1)}` : avgGymLift.toFixed(1);
        insights.push({ icon: "🏋️", text: `The gym moves your mood ${s} points on average from wake-up to post-workout. ${avgGymLift >= 0.5 ? "That's a real lift." : "Still showing up counts."}` });
      }
      if (avgGymMood !== null && avgNoGymMood !== null) {
        const diff = (avgGymMood - avgNoGymMood).toFixed(1);
        insights.push({ icon: "📈", text: `Post-gym mood avg ${avgGymMood.toFixed(1)}/5 vs non-gym days ${avgNoGymMood.toFixed(1)}/5.${diff > 0 ? ` The gym gives you a +${diff} edge.` : ""}` });
      }
      if (gymStreak >= 3) insights.push({ icon: "🔥", text: `${gymStreak}-day gym streak. Keep it going.` });
      if (zeroDrinkStreak >= 2) insights.push({ icon: "✨", text: `${zeroDrinkStreak} nights in a row with zero drinks. You never regret a clear-headed morning.` });
      const last7Heavy = last7.filter((e) => e.drinks === 2).length;
      if (last7Heavy >= 3) insights.push({ icon: "⚠️", text: `${last7Heavy} of your last 7 nights had 3+ drinks. Alcohol raises dementia risk and slows metabolism over time.` });

      return (
        <div>
          <h2 style={{ color: C.text, fontSize: 20, fontWeight: 700, margin: "0 0 20px" }}>Your trends</h2>

          <div style={{ display: "flex", gap: 10, marginBottom: 20 }}>
            <StatCard label="Gym rate" value={`${gymRate}%`} sub={`${gymYes} of ${entries.length} days`} color={gymRate >= 50 ? C.sage : C.amber} />
            <StatCard label="Zero-drink nights" value={`${Math.round((drinkCounts[0] / (totalDrinkEntries || 1)) * 100)}%`} sub={`${drinkCounts[0]} of ${totalDrinkEntries}`} color={C.sage} />
            <StatCard label="Days logged" value={entries.length} sub="total entries" color={C.blue} />
          </div>

          <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 12, padding: 16, marginBottom: 16 }}>
            <SL text="Weekly drink totals" />
            {weekTotals.map(([ws, total], i) => {
              const over = total > weeklyGoal;
              const color = over ? C.coral : total / weeklyGoal > 0.75 ? C.amber : C.sage;
              const label = ws === currentWeekStart ? "This week" : new Date(ws + "T12:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric" });
              return (
                <div key={ws} style={{ marginBottom: i < weekTotals.length - 1 ? 10 : 0 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
                    <span style={{ color: i === 0 ? C.text : C.soft, fontSize: 12 }}>{label}</span>
                    <span style={{ color, fontSize: 12, fontWeight: 600 }}>~{total % 1 === 0 ? total : total.toFixed(1)} {over ? "⚠️" : ""}</span>
                  </div>
                  <Bar value={total} max={Math.max(weeklyGoal * 1.5, total + 1)} color={color} />
                </div>
              );
            })}
            <p style={{ color: C.muted, fontSize: 11, margin: "10px 0 0" }}>Goal: {weeklyGoal}/week · Drinks counted on the night consumed · Midpoints used (1–2 → 1.5, 3+ → 3)</p>
          </div>

          <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 12, padding: 16, marginBottom: 16 }}>
            <SL text="Drink nights breakdown" />
            {DRINK_BUCKETS.map((b, i) => (
              <div key={b.value} style={{ marginBottom: i < 2 ? 12 : 0 }}>
                <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 5 }}>
                  <span style={{ color: C.text, fontSize: 13 }}>{b.label}</span>
                  <span style={{ color: b.color, fontSize: 13, fontWeight: 600 }}>{drinkCounts[i]} nights ({totalDrinkEntries > 0 ? Math.round((drinkCounts[i] / totalDrinkEntries) * 100) : 0}%)</span>
                </div>
                <Bar value={drinkCounts[i]} max={totalDrinkEntries || 1} color={b.color} />
              </div>
            ))}
          </div>

          <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 12, padding: 16, marginBottom: 16 }}>
            <SL text="Morning mood by drinks the night before" />
            {avgMoodByDrink.map((b) => (
              <div key={b.value} style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
                <span style={{ color: C.soft, fontSize: 12, width: 68, flexShrink: 0 }}>{b.label}</span>
                {b.n > 0 ? (<><Bar value={b.avg ?? 0} max={5} color={b.color} /><span style={{ color: b.color, fontSize: 12, fontWeight: 600, width: 28, textAlign: "right" }}>{b.avg?.toFixed(1)}</span></>) : (<span style={{ color: C.muted, fontSize: 12 }}>No data yet</span>)}
              </div>
            ))}
            <SL text="Morning energy by drinks the night before" />
            {avgEnergyByDrink.map((b) => (
              <div key={b.value} style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
                <span style={{ color: C.soft, fontSize: 12, width: 68, flexShrink: 0 }}>{b.label}</span>
                {b.n > 0 ? (<><Bar value={b.avg ?? 0} max={5} color={b.color} /><span style={{ color: b.color, fontSize: 12, fontWeight: 600, width: 28, textAlign: "right" }}>{b.avg?.toFixed(1)}</span></>) : (<span style={{ color: C.muted, fontSize: 12 }}>No data yet</span>)}
              </div>
            ))}
          </div>

          {insights.length > 0 && (
            <div style={{ marginBottom: 16 }}>
              <SL text="What the data says" />
              {insights.map((ins, i) => <InsightRow key={i} icon={ins.icon} text={ins.text} />)}
            </div>
          )}

          <SL text="Recent log" />
          {entries.slice(0, 14).map((e) => {
            const hasNote = e.note && e.note.trim().length > 0;
            const isOpen = expandedNote === e.date;
            const isPartial = e.drinks === null || e.wakeupMood === null || e.wakeupEnergy === null || e.gym === null;
            return (
              <div key={e.date} style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 10, marginBottom: 6, overflow: "hidden" }}>
                <div style={{ display: "flex", gap: 8, alignItems: "center", padding: "10px 14px" }}>
                  <span style={{ color: C.soft, fontSize: 11, width: 62, flexShrink: 0 }}>
                    {new Date(e.date + "T12:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric" })}
                  </span>
                  {e.drinks !== null ? <span style={{ fontSize: 16 }}>{e.drinks === 0 ? "💧" : e.drinks === 1 ? "🍷" : "🍾"}</span> : <span style={{ color: C.muted, fontSize: 12 }}>—</span>}
                  <span style={{ fontSize: 16 }}>{moodEmoji(e.wakeupMood, MOODS)}</span>
                  <span style={{ fontSize: 16 }}>{moodEmoji(e.wakeupEnergy, ENERGY)}</span>
                  <span style={{ fontSize: 14 }}>{e.gym === "Yes" ? "🏋️" : e.gym === "No" ? "—" : ""}</span>
                  {e.gymMood && <span style={{ fontSize: 14 }}>{moodEmoji(e.gymMood, MOODS)}</span>}
                  {e.otherActivity === "Yes" && <span style={{ fontSize: 14 }}>🚶</span>}
                  {isPartial && <span style={{ color: C.amber, fontSize: 10, marginLeft: 2 }}>partial</span>}
                  <div style={{ flex: 1 }} />
                  {hasNote && (
                    <button onClick={() => setExpandedNote(isOpen ? null : e.date)} style={{
                      background: isOpen ? C.sageDim : "transparent", border: `1px solid ${isOpen ? C.sage : C.border}`,
                      borderRadius: 6, padding: "3px 8px", cursor: "pointer",
                      color: isOpen ? C.sage : C.muted, fontSize: 11,
                    }}>
                      {isOpen ? "hide" : "📝"}
                    </button>
                  )}
                </div>
                {hasNote && isOpen && (
                  <div style={{ padding: "0 14px 12px", borderTop: `1px solid ${C.border}` }}>
                    <p style={{ color: C.soft, fontSize: 12, margin: "10px 0 0", lineHeight: 1.6, fontStyle: "italic" }}>"{e.note}"</p>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      );
    }

    // ── DATA PORTAL ───────────────────────────────────────────

    function DataPortal({ log, weeklyGoal, onImport, onClose }) {
      const [mode, setMode] = useState("menu");
      const [importText, setImportText] = useState("");
      const [importError, setImportError] = useState("");
      const [copied, setCopied] = useState(false);

      const exportData = JSON.stringify({ log, weeklyGoal, exportedAt: new Date().toISOString() }, null, 2);

      const handleCopy = async () => {
        try {
          await navigator.clipboard.writeText(exportData);
          setCopied(true);
          setTimeout(() => setCopied(false), 2000);
        } catch {
          document.getElementById("export-ta")?.select();
        }
      };

      const handleImport = () => {
        setImportError("");
        try {
          const parsed = JSON.parse(importText.trim());
          if (!parsed.log || typeof parsed.log !== "object") throw new Error("Invalid format — missing log data.");
          onImport(parsed.log, parsed.weeklyGoal ?? 7);
          onClose();
        } catch (e) {
          setImportError(e.message || "Invalid JSON. Make sure you pasted the full export.");
        }
      };

      return (
        <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.7)", zIndex: 200, display: "flex", alignItems: "flex-end", justifyContent: "center" }}
          onClick={(e) => e.target === e.currentTarget && onClose()}>
          <div style={{ background: C.surface, borderRadius: "20px 20px 0 0", width: "100%", maxWidth: 520, padding: "24px 20px 40px", border: `1px solid ${C.border}`, maxHeight: "85vh", overflowY: "auto" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20 }}>
              <h3 style={{ color: C.text, fontSize: 17, fontWeight: 700, margin: 0 }}>
                {mode === "menu" ? "Data" : mode === "export" ? "Export data" : "Import data"}
              </h3>
              <button onClick={onClose} style={{ background: "transparent", border: "none", color: C.muted, fontSize: 22, cursor: "pointer" }}>×</button>
            </div>

            {mode === "menu" && (
              <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                <button onClick={() => setMode("export")} style={{ padding: "14px 16px", background: C.bg, border: `1px solid ${C.border}`, borderRadius: 12, cursor: "pointer", textAlign: "left", display: "flex", alignItems: "center", gap: 12 }}>
                  <span style={{ fontSize: 22 }}>📤</span>
                  <div>
                    <p style={{ color: C.text, fontSize: 14, fontWeight: 600, margin: "0 0 2px" }}>Export</p>
                    <p style={{ color: C.soft, fontSize: 12, margin: 0 }}>Copy your data to save in Notes or email</p>
                  </div>
                </button>
                <button onClick={() => setMode("import")} style={{ padding: "14px 16px", background: C.bg, border: `1px solid ${C.border}`, borderRadius: 12, cursor: "pointer", textAlign: "left", display: "flex", alignItems: "center", gap: 12 }}>
                  <span style={{ fontSize: 22 }}>📥</span>
                  <div>
                    <p style={{ color: C.text, fontSize: 14, fontWeight: 600, margin: "0 0 2px" }}>Import</p>
                    <p style={{ color: C.soft, fontSize: 12, margin: 0 }}>Paste previously exported data to restore</p>
                  </div>
                </button>
              </div>
            )}

            {mode === "export" && (
              <div>
                <p style={{ color: C.soft, fontSize: 13, margin: "0 0 12px", lineHeight: 1.5 }}>Copy the text below and paste it into your Notes app. Use Import to restore it later.</p>
                <textarea id="export-ta" readOnly value={exportData} rows={8}
                  style={{ width: "100%", padding: "12px", background: C.bg, border: `1px solid ${C.border}`, borderRadius: 10, color: C.soft, fontSize: 11, fontFamily: "monospace", resize: "none", boxSizing: "border-box" }}
                  onFocus={(e) => e.target.select()} />
                <button onClick={handleCopy} style={{ width: "100%", marginTop: 12, padding: "14px", background: copied ? C.sageDim : C.sage, border: `1px solid ${copied ? C.sage : "transparent"}`, borderRadius: 12, color: "#fff", fontSize: 15, fontWeight: 700, cursor: "pointer" }}>
                  {copied ? "✓ Copied!" : "Copy to clipboard"}
                </button>
                <button onClick={() => setMode("menu")} style={{ width: "100%", marginTop: 8, padding: "12px", background: "transparent", border: "none", color: C.soft, fontSize: 13, cursor: "pointer" }}>← Back</button>
              </div>
            )}

            {mode === "import" && (
              <div>
                <p style={{ color: C.soft, fontSize: 13, margin: "0 0 12px", lineHeight: 1.5 }}>Paste your previously exported data below. This will replace your current data.</p>
                <textarea value={importText} onChange={(e) => setImportText(e.target.value)} placeholder="Paste your exported JSON here…" rows={8}
                  style={{ width: "100%", padding: "12px", background: C.bg, border: `1.5px solid ${importError ? C.coral : C.border}`, borderRadius: 10, color: C.text, fontSize: 11, fontFamily: "monospace", resize: "none", boxSizing: "border-box", outline: "none" }} />
                {importError && <p style={{ color: C.coral, fontSize: 12, margin: "6px 0 0" }}>{importError}</p>}
                <button onClick={handleImport} disabled={!importText.trim()} style={{ width: "100%", marginTop: 12, padding: "14px", background: importText.trim() ? C.sage : C.muted, border: "none", borderRadius: 12, color: importText.trim() ? "#fff" : C.soft, fontSize: 15, fontWeight: 700, cursor: importText.trim() ? "pointer" : "default" }}>
                  Restore data
                </button>
                <button onClick={() => setMode("menu")} style={{ width: "100%", marginTop: 8, padding: "12px", background: "transparent", border: "none", color: C.soft, fontSize: 13, cursor: "pointer" }}>← Back</button>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ── ROOT ──────────────────────────────────────────────────

    function App() {
      const [tab, setTab] = useState("checkin");
      const [log, setLog] = useState(() => loadAll());
      const [weeklyGoal, setWeeklyGoal] = useState(() => loadSettings().weeklyGoal ?? 7);
      const [activeDate, setActiveDate] = useState(todayKey());
      const [showPortal, setShowPortal] = useState(false);
      const [saveFlash, setSaveFlash] = useState(false);

      const handleChangeGoal = (n) => {
        setWeeklyGoal(n);
        saveSettings({ weeklyGoal: n });
      };

      const handleSave = (date, form) => {
        const updated = { ...log, [date]: { ...form, savedAt: new Date().toISOString() } };
        setLog(updated);
        saveAll(updated);
        setSaveFlash(true);
        setTimeout(() => setSaveFlash(false), 1500);
      };

      const handleImport = (importedLog, importedGoal) => {
        setLog(importedLog);
        setWeeklyGoal(importedGoal);
        saveAll(importedLog);
        saveSettings({ weeklyGoal: importedGoal });
      };

      const todayHasEntry = !!log[todayKey()];

      return (
        <div style={{ background: C.bg, minHeight: "100vh" }}>
          <div style={{ padding: "20px 20px 0", borderBottom: `1px solid ${C.border}`, position: "sticky", top: 0, background: C.bg, zIndex: 10 }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <span style={{ fontSize: 22 }}>🌿</span>
                <span style={{ color: C.text, fontSize: 17, fontWeight: 700 }}>Wellness Log</span>
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                {todayHasEntry && (
                  <span style={{ background: C.sageDim, color: C.sage, fontSize: 11, fontWeight: 600, padding: "3px 10px", borderRadius: 20, border: `1px solid ${C.sage}44` }}>
                    Today logged ✓
                  </span>
                )}
                <button onClick={() => setShowPortal(true)} style={{ background: C.bg, border: `1px solid ${C.border}`, borderRadius: 8, padding: "5px 10px", cursor: "pointer", color: C.soft, fontSize: 18, lineHeight: 1 }} title="Export / Import data">💾</button>
              </div>
            </div>
            <div style={{ display: "flex" }}>
              {["checkin", "trends"].map((t) => (
                <button key={t} onClick={() => setTab(t)} style={{
                  flex: 1, padding: "10px", background: "transparent", border: "none",
                  borderBottom: `2px solid ${tab === t ? C.sage : "transparent"}`,
                  color: tab === t ? C.sage : C.soft,
                  fontSize: 13, fontWeight: tab === t ? 700 : 400, cursor: "pointer",
                }}>
                  {t === "checkin" ? "Check-in" : "Trends"}
                </button>
              ))}
            </div>
          </div>

          {saveFlash && (
            <div style={{ background: C.sageDim, borderBottom: `1px solid ${C.sage}44`, padding: "8px 20px", display: "flex", alignItems: "center", gap: 8 }}>
              <span style={{ fontSize: 14 }}>✓</span>
              <p style={{ color: C.sage, fontSize: 12, margin: 0 }}>Saved to your device.</p>
            </div>
          )}

          {showPortal && <DataPortal log={log} weeklyGoal={weeklyGoal} onImport={handleImport} onClose={() => setShowPortal(false)} />}

          <div style={{ padding: "24px 20px 60px", maxWidth: 520, margin: "0 auto" }}>
            {tab === "checkin"
              ? <CheckIn log={log} onSave={handleSave} weeklyGoal={weeklyGoal} onChangeGoal={handleChangeGoal} activeDate={activeDate} onChangeDate={setActiveDate} />
              : <Trends data={log} weeklyGoal={weeklyGoal} />}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
